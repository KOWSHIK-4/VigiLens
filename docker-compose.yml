services:
  postgres:
    image: postgres:16-alpine
    container_name: vigilens-db
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vigilens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigilens_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vigilens}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigilens}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1.0
    networks:
      - internal

  ai-service:
    build:
      context: ./ai
      dockerfile: ../docker/ai/Dockerfile
    container_name: vigilens-ai
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - NODE_ENV=production
      - BACKEND_URL=http://backend:4000
      - BACKEND_INTERNAL_KEY=${INTERNAL_API_KEY:-dev-internal-key-change-in-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 2g
    cpus: 2.0
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: vigilens-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vigilens}:${POSTGRES_PASSWORD:-vigilens_secret}@postgres:5432/${POSTGRES_DB:-vigilens}
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - JWT_EXPIRES_IN=7d
      - AI_SERVICE_URL=http://ai-service:8000
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev-internal-key-change-in-production}
      - LOG_LEVEL=info
    volumes:
      - storage_data:/data/vigilens
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    cpus: 1.0
    networks:
      - internal
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: vigilens-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # The nginx proxy injects this as X-Internal-Key on /detect/ requests
      # so the AI service's guarded stream/stats endpoints stay reachable
      # from the browser without exposing the key client-side.
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev-internal-key-change-in-production}
    mem_limit: 256m
    cpus: 0.5
    networks:
      - frontend

networks:
  frontend:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  storage_data:
